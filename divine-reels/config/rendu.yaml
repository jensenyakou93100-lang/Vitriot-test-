# ─────────────────────────────────────────────────────────────
#  Réglages techniques du rendu
# ─────────────────────────────────────────────────────────────

format:
  largeur: 1080
  hauteur: 1920
  images_par_seconde: 30

# Zones mortes d'Instagram / Reels : aucun texte de l'outil n'a le droit d'y entrer.
zones_sures:
  haut: 250      # pixels réservés en haut (interface Instagram)
  bas: 420       # pixels réservés en bas (légende, boutons, « En savoir plus »)
  marge_cotes: 60

duree:
  minimum: 15
  maximum: 45

encodage:
  preset: "medium"       # compromis vitesse / qualité sur un processeur ordinaire
  crf: 20                # qualité (plus bas = plus beau et plus lourd)
  debit_max: "12M"       # plafond : 45 s × 12 Mb/s ≈ 68 Mo, donc toujours < 100 Mo
  audio_debit: "192k"
  audio_frequence: 48000

audio:
  loudness_cible: -14    # LUFS, niveau conseillé pour Instagram / Facebook
  crete_max: -1.0        # dBFS, au-dessus = saturation

verification:
  taille_max_mo: 100
  crete_refus: -0.1      # dBFS : au-delà, le son est considéré comme saturé

inventaire:
  seuil_flou: 60         # netteté minimale (plus bas = plus flou)
  seuil_silence: -50     # dB de volume moyen : en dessous, rush considéré muet

transcription:
  modele: "small"        # faster-whisper, en local, sur le processeur
  # Mots que Whisper doit savoir écrire correctement
  vocabulaire: "Divine Nettoyage, canapé, vitres, injecteur-extracteur, crédit d'impôt, devis gratuit, Val-d'Oise."

sous_titres:
  police: "texte_gras"   # rôle de police défini dans marque.yaml
  taille: 96
  contour: 8             # contour noir épais : lisible sur tous les fonds
  ombre: 3
  bas_du_texte: 1420     # tiers inférieur, au-dessus de la zone morte (1500)
  mots_min: 2
  mots_max: 4
  pause_coupure: 0.35    # une pause plus longue démarre un nouveau groupe de mots
  tenue_apres: 0.25      # le groupe reste affiché un instant après le dernier mot
  majuscules: false

voix_off:
  # Un fichier dont le nom commence par « voix » (voix.m4a, voix_canape.mov…)
  # est utilisé comme commentaire par-dessus les images.
  ambiance_db: -18       # bruit des rushes conservé discrètement sous la voix
